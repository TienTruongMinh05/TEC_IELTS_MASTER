<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEC IELTS - Trang chủ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background: #4a90e2; color: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .skill-selection { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .skill-btn { background: #e2e8f0; color: #475569; font-size: 14px; padding: 10px 15px; border-radius: 8px; }
        .skill-btn.active { background: #4a90e2; color: white; box-shadow: 0 2px 4px rgba(74, 144, 226, 0.4); }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .test-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .test-card h3 { margin-top: 0; color: #2c3e50; }
        .test-card p { color: #64748b; font-size: 14px; }
        .do-test-btn { background: #2ed573; color: white; margin-top: 15px; width: 100%; }
        .unavailable-msg { background: #fff7ed; border-radius: 8px; color: #c2410c; font-size: 14px; font-weight: bold; margin-top: 15px; padding: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">TEC IELTS MASTER</div>
    </header>

    <div class="container">
        <h2>Danh sách đề thi IELTS</h2>
        <p id="welcome-msg">Chọn kỹ năng và bắt đầu làm bài, không cần đăng nhập.</p>

        <div class="skill-selection">
            <button class="skill-btn active" onclick="loadSkill('R', this)">READING</button>
            <button class="skill-btn" onclick="loadSkill('L', this)">LISTENING</button>
            <button class="skill-btn" onclick="loadSkill('W', this)">WRITING</button>
            <button class="skill-btn" onclick="loadSkill('S', this)">SPEAKING</button>
        </div>

        <div class="test-grid" id="test-grid">
            <p id="loading-text">Đang tải danh sách đề thi...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
