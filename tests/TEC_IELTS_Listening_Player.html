<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEC IELTS Listening Player</title>
    <style>
        :root { --blue: #2aa9d9; --teal: #2e6175; --mist: #f5fafc; --ink: #17364a; --red: #c1121f; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--mist); color: #1f2937; font-family: Arial, sans-serif; }
        header { background: white; border-bottom: 4px solid var(--blue); box-shadow: 0 2px 12px #0001; padding: 14px 20px; }
        .header-inner { align-items: center; display: flex; gap: 16px; justify-content: space-between; margin: auto; max-width: 960px; }
        h1 { color: var(--teal); font-size: 24px; margin: 0; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 4px; }
        .back-link { background: #e8f6fb; border-radius: 10px; color: var(--teal); font-weight: 700; padding: 10px 14px; text-decoration: none; }
        main { margin: 30px auto; max-width: 760px; padding: 0 16px; }
        .panel { background: white; border-radius: 16px; box-shadow: 0 2px 14px #00000012; margin-bottom: 16px; padding: 22px; }
        .section-status { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
        .badge { background: var(--teal); border-radius: 999px; color: white; font-size: 13px; font-weight: 800; padding: 7px 12px; }
        #status { color: #64748b; line-height: 1.5; margin: 16px 0; }
        #status.error { color: var(--red); }
        audio { display: block; width: 100%; }
        .section-buttons { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); margin-top: 18px; }
        .section-button { background: #e8f6fb; border: 0; border-radius: 10px; color: var(--teal); cursor: pointer; font-weight: 800; padding: 11px 8px; }
        .section-button.active { background: var(--teal); color: white; }
        #continue-btn { background: var(--blue); border: 0; border-radius: 10px; color: white; cursor: pointer; display: none; font-weight: 800; margin-top: 14px; padding: 11px 16px; width: 100%; }
        .notice { background: #ecfeff; border: 1px solid #67e8f9; border-radius: 12px; color: #155e75; line-height: 1.5; padding: 14px; }
        @media (max-width: 600px) {
            .header-inner { align-items: flex-start; flex-direction: column; }
            .section-buttons { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1 id="test-title">TEC IELTS Listening</h1>
                <div class="subtitle">Audio được phát trực tiếp từ Supabase Storage</div>
            </div>
            <a class="back-link" href="../index.html">← Trang chủ</a>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="section-status">
                <strong id="section-label">Đang chuẩn bị...</strong>
                <span class="badge" id="section-progress">0 / 4</span>
            </div>
            <p id="status" role="status" aria-live="polite">Đang tải thông tin bài nghe...</p>
            <audio id="audio-player" controls preload="metadata"></audio>
            <button id="continue-btn" type="button">Tiếp tục section kế tiếp</button>
            <div class="section-buttons" id="section-buttons" aria-label="Chọn section"></div>
        </section>

        <p class="notice">Không cần đăng nhập. Audio của bài đã được bật có thể nghe trực tiếp trên trình duyệt.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"></script>
    <script src="../supabase-config.js"></script>
    <script src="listening-player.js"></script>
</body>
</html>
