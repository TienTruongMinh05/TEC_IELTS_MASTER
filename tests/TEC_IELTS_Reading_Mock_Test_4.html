const PASSAGES=[{"title": "Reading Passage 1", "subtitle": "Museums and family visitors in Australia", "range": "Questions 1-13", "text": "Museums and family visitors in Australia\n\nMuseums in Australia have recognised the need to become more responsive to their audiences, especially families who visit museums in large numbers. Research has consistently found that positive early family visits to museums have a significant impact on later visiting habits. What is more, researchers have identified the importance of learning in family visits and the different roles that various family members play before, during and after their visit.\n\nFor many years museums in Australia have acknowledged the importance of families as visitors, with several establishing separate spaces for these groups, especially those with very young children. Major museums have developed dedicated spaces specifically designed for children and families. For example, the Melbourne Museum's Children's Gallery is aimed at three- to eight-year-olds and has a mandate to encourage children to discover and explore within a range of science issues. The goal is to provide an interactive, hands-on and playful space that engages all the senses through continually updated exhibitions. The National Museum of Australia in Canberra developed Kspace, an interactive space where children design their own future with the help of technology. This museum also designed Our Place, a series of cosy play spaces where children can explore the museum's themes in their own ways.\n\nOther museums have also considered the entire family when designing their dedicated spaces. The Australian National Maritime Museum in Sydney, when developing Pirates, its below-the-deck pirate ship experience, realised that exhibitions aimed at children, particularly school-aged children, also needed more sophisticated exhibits to occupy their accompanying parents. The Powerhouse Museum in Sydney, while catering to varying tastes within families through its many temporary exhibitions and programs, recognised the value of a dedicated space for children who were visiting with their parents. The museum's installation, Zoe's House, caters specifically for children aged three to five years, to facilitate cooperation in children through play.\n\nFamily visits to museums in Australia share a number of characteristics. Generally, visitors take time for orientation, enter with a sense of curiosity, link what they see to their own prior experiences and are most attracted to interactive displays. Their common viewing behaviour involves looking very closely at each display in the first gallery and then skimming and moving randomly in subsequent galleries. Their visiting behaviour is modified by increased experience with the setting: they like to revisit favourite displays, share their viewing and learning in a social context and interact with people from the museum. They respond to physical needs by using the comfortable chairs provided or having a break after a little more than an hour, and generally stay for two hours at most.\n\nResearch has found that adult members of family groups play three roles which are particularly relevant to the family group during the visit: visit manager by directing and organising; museum expert through explaining, clarifying and correcting; and learning-facilitator in questioning and reminiscing. These roles occur simultaneously, are closely linked to the process of learning and are dependent on both the social context of the visit and the group composition, particularly the ages of any accompanying children.\n\nParents consider museum visits to be valuable in creating and strengthening relationships with their children and in enabling them to tune into what fascinates their children. Parents make use of learning facilities such as open access libraries and activity kits if they know the resources are there and understand their role. Family members each take notice of different aspects of an exhibit and construct a shared meaning together. Museums are seen as a good day out, something the whole family can enjoy as a different form of education, and are generally considered good value for money.\n\nIn this increasingly complex world, where the real and virtual are blurring, and where changes in society can seem overwhelming, museums are able to provide spaces for families to be together as well as learn together. Parents value museum visits because they provide children with opportunities to learn in different ways through bringing concepts to life and enhancing school learning experiences. Museums stimulate visitors of all ages and open their minds to new ideas, the world around them, history and other cultures. Children enjoy museums as places where they can fantasise, explore and learn in ways that are more engaging than they experience in more formal settings, such as school. Museums need to identify the elements that families value, the ways families interact with museums, and how museums operate as extremely effective learning units. The challenge is for museums to then apply these principles, not only to the development of future exhibitions and programs, but also to the ways they plan for all visitors.", "questions": "<h3>Questions 1-5</h3>\n<p>Complete the table. Choose <strong>ONE WORD ONLY</strong> from the passage.</p>\n<div class=\"noteBox\">\n<h3>Dedicated museum spaces for families with children</h3>\n<p><strong>Melbourne Museum — Children's Gallery</strong><br>Target users: 3–8 year olds<br>Aim: present <span class=\"inlineAnswer\" data-q=\"1\"></span> topics in interesting ways and stimulate children's senses.</p>\n<p><strong>National Museum of Australia — Kspace / Our Place</strong><br>Target users: children<br>Aim: use <span class=\"inlineAnswer\" data-q=\"2\"></span> to imagine the future.</p>\n<p><strong>Australian National Maritime Museum — Pirates</strong><br>Target users: children of school age and their <span class=\"inlineAnswer\" data-q=\"3\"></span><br>Aim: simulate the life of a pirate.</p>\n<p><strong><span class=\"inlineAnswer\" data-q=\"4\"></span> Museum — Zoe's House</strong><br>Target users: pre-schoolers<br>Aim: use play to encourage <span class=\"inlineAnswer\" data-q=\"5\"></span> between children.</p>\n</div>\n<h3>Questions 6-9</h3>\n<p>Complete the notes. Choose <strong>NO MORE THAN TWO WORDS AND/OR A NUMBER</strong>.</p>\n<div class=\"noteBox\"><h3>Family visits to museums</h3>\n<p>When families visit museums, they usually:</p>\n<p>• prefer exhibits that are <span class=\"inlineAnswer\" data-q=\"6\"></span></p>\n<p>• enjoy seeing their <span class=\"inlineAnswer\" data-q=\"7\"></span> a second time</p>\n<p>• sit or take a <span class=\"inlineAnswer\" data-q=\"8\"></span></p>\n<p>• stay for a maximum of <span class=\"inlineAnswer\" data-q=\"9\"></span></p></div>\n<h3>Questions 10-13</h3>\n<p><strong>TRUE / FALSE / NOT GIVEN</strong></p>\n<ol start=\"10\">\n<li>Some adult visitors behave like a museum specialist when guiding younger visitors. <span class=\"inlineAnswer short\" data-q=\"10\"></span></li>\n<li>It is more enjoyable to visit a museum with a group of children who are all the same age. <span class=\"inlineAnswer short\" data-q=\"11\"></span></li>\n<li>Parents think that the cost of visiting museums is too high. <span class=\"inlineAnswer short\" data-q=\"12\"></span></li>\n<li>Children want to visit museums after they learn about a topic at school. <span class=\"inlineAnswer short\" data-q=\"13\"></span></li>\n</ol>"}, {"title": "Reading Passage 2", "subtitle": "Boring buildings", "range": "Questions 14-26", "text": "Boring buildings\n\nThere could be more than an economic or nostalgic price to impersonal retail and high-rise construction; boring architecture may take an emotional toll on the people forced to live with it.\n\nA\n\nA growing body of research in cognitive science illuminates the physical and mental toll bland cityscapes take on residents. Generally, these researchers argue that humans are healthier when they live surrounded by variety or work in well-designed, unique spaces, rather than unattractive, generic ones. Urban policy professor Justin Hollander and architect Ann Sussman review scientific data to help architects and urban planners understand how, exactly, people respond to their built surroundings, particularly at work. People, they argue, function best in intricate settings, not 'big, blank, boxy offices'.\n\nB\n\nIndeed, that's what Colin Ellard, a neuroscientist at the University of Waterloo in Canada, has found in his work. Five years ago, Ellard became interested in a certain building - the gigantic Whole Foods Market 'plopped into' a notoriously textured part of lower Manhattan in New York. Ellard partnered with the Guggenheim Museum to analyze what happens when someone walks out of a tiny neighborhood restaurant and encounters a full city block with nothing but 'the long, blank facade of the Whole Foods Market' building.\n\nIn 2011, Ellard led small groups on Lower East Side walks to measure the effect of the urban environment on them. Participants recorded their response to questions at each stopping point and wore sensors that measured skin conductance, a response to emotional excitement. Passing the monolithic Whole Foods Market, people's state of arousal plummeted. Physiologically, Ellard explained, they were bored. To describe this place, they used words like 'bland' and 'passionless'. In contrast, one block east at the other test site - a 'lively sea of restaurants with lots of open doors and windows' - people measured high levels of excitement, and they listed words like 'lively' and 'socializing'. Ellard explains that the main objective of urban design should be to produce some kind of novelty or change every few seconds; otherwise, we become cognitively disengaged.\n\nC\n\nThe trick, it seems, is to design a world that excites but doesn't overload our faculties with a constant barrage of information. 'We are, as animals, programmed to respond to thrill,' said professor Brendan Walker. In Walker's 'thrill laboratory' at the University of Nottingham in the UK, devices measure heart rate and skin conductance to see how people respond to adrenaline-producing experiences such as a roller-coaster ride. A thrilling encounter moves us quickly from a state of equilibrium to a desirable 'disorientation'. 'Humans want a certain element of turmoil or confusion,' he said. 'Complexity is thrilling whether in an amusement park or architecture.'\n\nD\n\nPsychologists have found that awe-inspiring moments can potentially improve our well-being. One study conducted by Melanie Rudd, Kathleen Vohs and Jennifer Aaker of Stanford University in the US showed that the feeling of 'awe' can make people more patient and less materialistic. In an experiment, the researchers showed students 60-second clips of waterfalls, whales, or astronauts in space. After only a minute of virtual images, those who said they were awed also felt less pressed for time. And in another variation, people made hypothetical choices between physical and experiential goods of equal monetary value. Those who had just 'felt awe' were more likely to choose an experience over a possession, a choice that is linked with greater satisfaction in the long run. In other words, a visual buzz - whether architectural or natural - might have the ability to change our frame of mind, making modern-day life more satisfying and interactive.\n\nE\n\nIt's important to note, however, that architectural boredom isn't about how pristine a street is. People often confuse successful architecture with whether an area looks pleasant. On the contrary, when it comes to city buildings, people often focus too narrowly on aesthetics, said Charles Montgomery, author of Happy City: Transforming Our Lives Through Urban Design. Some of the happiest blocks in New York City, he argues, are 'kind of ugly and messy'.\n\nIn 2014, Montgomery's Happy City lab conducted an experiment in which he found a strong correlation between messier blocks and pro-social behavior. Montgomery sent researchers, posing as lost tourists, to places he coded as either 'active' or 'inactive' facades. He concluded that the former had a high level of interest, that is they were messy, while the latter had no special features such as long warehouse blocks. Pedestrians at active sites were nearly five times more likely to offer assistance than at inactive ones. Of those who assisted, seven times as many at the active site offered use of their phone.\n\nF\n\nFortunately, it's not necessarily a dichotomy - new architecture can achieve the optimal level of cacophony and beauty. Take the 2006 Hearst Tower in midtown Manhattan. Designed by architect Norman Foster, Hearst Tower is a glass-and-steel skyscraper, 40 stories of which are designed in a triangular pattern, differing in style from the 1920s Art Deco base. From the outside, the facade jolts city dwellers from their daily commutes, while energizing employees who enter it each morning. For many who walk by, Hearst Tower's design may not be the easiest to understand; it's both sleek and old. The top looks like it traveled from the future. Inside, workers travel upon diagonal escalators, up a three-story water sculpture, through the tower's historic atrium, flooded with light. Few New Yorkers who pass by would find this building boring. And they're likely to be happier - maybe even nicer to each other - because of it.", "questions": "<h3>Questions 14-18</h3>\n<p>Which section, <strong>A-F</strong>, contains the following information?</p>\n<ol start=\"14\">\n<li>A description of a building that has a positive effect. <span class=\"inlineAnswer letter\" data-q=\"14\"></span></li>\n<li>A reference to architecture affecting people's performance in their jobs. <span class=\"inlineAnswer letter\" data-q=\"15\"></span></li>\n<li>Examples of the intensity of people's reactions in two urban settings. <span class=\"inlineAnswer letter\" data-q=\"16\"></span></li>\n<li>Details of a study where seeing certain pictures reduced people's stress. <span class=\"inlineAnswer letter\" data-q=\"17\"></span></li>\n<li>A claim about feelings experienced in response to both architecture and leisure settings. <span class=\"inlineAnswer letter\" data-q=\"18\"></span></li>\n</ol>\n<h3>Questions 19-23</h3>\n<p>Match each statement with the correct researcher, <strong>A-D</strong>.</p>\n<div class=\"people\">A Colin Ellard<br>B Brendan Walker<br>C Rudd, Vohs and Aaker<br>D Charles Montgomery</div>\n<ol start=\"19\">\n<li>The aim of good city planning is to provide variety in architecture. <span class=\"inlineAnswer letter\" data-q=\"19\"></span></li>\n<li>People in untidy areas were more helpful. <span class=\"inlineAnswer letter\" data-q=\"20\"></span></li>\n<li>People who had recently felt amazed placed less importance on material goods. <span class=\"inlineAnswer letter\" data-q=\"21\"></span></li>\n<li>'Attractive' places are not necessarily the most enjoyable places to be. <span class=\"inlineAnswer letter\" data-q=\"22\"></span></li>\n<li>One particular building failed to provide visual stimulation. <span class=\"inlineAnswer letter\" data-q=\"23\"></span></li>\n</ol>\n<h3>Questions 24-26</h3>\n<p>Complete the summary. Choose <strong>ONE WORD ONLY</strong>.</p>\n<div class=\"noteBox\"><h3>Hearst Tower</h3>\n<p>The sight of the building's <span class=\"inlineAnswer\" data-q=\"24\"></span> has a striking impact on commuters and employees.</p>\n<p>Inside the tower, <span class=\"inlineAnswer\" data-q=\"25\"></span> carry employees up past a large water sculpture in the light-filled <span class=\"inlineAnswer\" data-q=\"26\"></span>.</p>\n</div>"}, {"title": "Reading Passage 3", "subtitle": "Thinking for themselves", "range": "Questions 27-40", "text": "Thinking for themselves\n\nSome insights into animal intelligence\n\nIn 1977 Irene Pepperberg brought Alex, a one-year-old African grey parrot, into her lab at Harvard University to teach him to reproduce the sounds of English. At that time most scientists considered animals mere machines, lacking the ability to think in a rational way or feel emotions as humans do. 'I wasn't trying to see if Alex could learn a human language,' said Pepperberg. 'My plan always was to use his imitative skills to get a better understanding of avian cognition.' Given that Alex's brain was the size of a walnut, most researchers thought Pepperberg's study would be futile.\n\nBut by the time Alex died in 2007, he knew 150 words, could count, do simple arithmetic, and distinguish between objects according to shape, colour, and material. Many of Alex's skills, such as his ability to understand the concepts of 'same' and 'different', are generally ascribed only to higher mammals. But parrots, like higher apes and humans, live in complex societies, and need to monitor changing relationships and environments.\n\n'They need to distinguish colours to know when a fruit is ripe or unripe,' Pepperberg noted. 'They need to categorize things - what's edible, what isn't - and to know the shapes of predators. And it helps to have a concept of numbers if you need to keep track of your flock. For a long-lived bird, you can't do all of this with instinct; cognition must be involved.'\n\nJust how easily mental skills can be acquired is perhaps best illustrated by dogs. For abstract thinking, humans employ symbols, letting one thing stand for another. And Juliane Kaminski, of the Max Planck Institute for Evolutionary Anthropology in Leipzig, believes that dogs can do this too. In 2008, Kaminski and her colleague Sebastian Tempelmann conducted an experiment with a border collie. The dog successfully selected and brought her owner toys which she had never seen before, prompted only by a picture of each toy.\n\nCreativity is another skill which seems to have evolved in humans and animals alike. 'People were initially surprised to discover that chimpanzees make tools,' says behavioral ecologist Alex Kacelnik. 'But then people thought, \"Well, they share our ancestry - of course they're smart.\" Now we're finding these kinds of exceptional behaviors in some species of birds.' New Caledonian crows, for example, use their beaks and claws to fashion tools to poke out grubs from palm trees. 'But the problem is we don't have a recently shared ancestry with birds - our last common ancestor was a reptile living over 300 million years ago.'\n\nKacelnik and his researchers at Oxford University were particularly impressed with the ingenuity of one of the crows - Betty, a wild-caught female. In one experiment, Betty successfully selected a hook-shaped wire to get a piece of meat from a glass tube. Then, when another bird unexpectedly stole the hook, Betty took a straight piece of wire, shaped it into a hook, and retrieved the food. This was the first time Betty had seen a piece of wire like this. Kacelnik says this 'is a major kind of cognitive sophistication.'\n\nWe are clearly not alone in our ability to invent or plan - or even to plot and lie. Studies show that western scrub jays can guess another bird's intentions and act on that knowledge. A jay knows that if another jay watches it hide a nut, there's a chance it will be stolen. So the first jay will return to move the nut when the other jay is gone. 'It's some of the best evidence so far of experience projection in another species,' says Nicky Clayton of Cambridge University. What's more, the jays seem to know how long ago they hid a particular kind of food, and they manage to retrieve it before it spoils.\n\nHuman cognitive psychologists call this ability 'episodic memory' and argue that it only exists in species that can mentally travel back in time. They believe that animals cannot distinguish among past, present, and future the way humans do. Such skepticism is a challenge for Clayton. 'We have good evidence that jays remember specific hiding events, which is the original definition of episodic memory. But now the goalposts have moved. Whenever we find a mental skill in a species that is reminiscent of human ability, the human cognition scientists change the definition.'\n\nCognitive psychologist Louis Herman has spent decades studying bottlenose dolphins. These intelligent mammals are highly interactive, social and cosmopolitan, living in subpolar to tropical environments worldwide. Among the many skills exhibited by Herman's dolphins is the ability to imitate the motor behaviors of instructors. If a trainer bent backward and lifted a leg, the dolphin would turn on its back and lift its tail in the air. This requires the imitator to form a mental image of the other individual's body, then adjust its own body accordingly - actions that imply an awareness of one's self, an ability once seen as the sole preserve of humans.\n\nWhat Herman finds fascinating is that these aquatic creatures diverged from primates millions of years ago. That kind of cognitive convergence suggests there must be some similar pressures selecting for intellect. 'We don't share their biology or ecology, but do share the need to establish life-long bonds and alliances. This appears to be the likely common driving force.'", "questions": "<h3>Questions 27-30</h3>\n<p>Complete each sentence with the correct ending, <strong>A-G</strong>.</p>\n<div class=\"people\">A make their own tools.<br>B copy a human's posture.<br>C recognise their own images.<br>D interpret visual representations of objects.<br>E use language creatively.<br>F predict another individual's actions.<br>G learn basic number skills.</div>\n<ol start=\"27\">\n<li>Irene Pepperberg has shown that parrots can <span class=\"inlineAnswer letter\" data-q=\"27\"></span></li>\n<li>Experiments have indicated that dogs know how to <span class=\"inlineAnswer letter\" data-q=\"28\"></span></li>\n<li>Research has revealed that scrub jays are able to <span class=\"inlineAnswer letter\" data-q=\"29\"></span></li>\n<li>Captive dolphins have been seen to <span class=\"inlineAnswer letter\" data-q=\"30\"></span></li>\n</ol>\n<h3>Questions 31-35</h3>\n<p>Choose the correct letter, <strong>A, B, C or D</strong>.</p>\n<ol start=\"31\">\n<li>What is Pepperberg doing in the third paragraph? <span class=\"inlineAnswer letter\" data-q=\"31\"></span><br>A justifying her belief in birds' cognitive skills<br>B explaining how cognition-based skills can be tested<br>C detailing the process by which birds acquire cognitive skills<br>D describing the differences between instinct- and cognition-based skills</li>\n<li>According to Kacelnik, people doubt birds' tool-making abilities because of the birds' <span class=\"inlineAnswer letter\" data-q=\"32\"></span><br>A brain size<br>B physical limitations<br>C evolutionary history<br>D feeding requirements</li>\n<li>What does Kacelnik say is most significant about Betty the crow's behaviour? <span class=\"inlineAnswer letter\" data-q=\"33\"></span><br>A her ability to visualise the finished tool<br>B her physical dexterity at crafting the tool<br>C her speed in solving a variety of problems<br>D her understanding of the flexible properties of the wire</li>\n<li>What is Clayton's complaint about human cognition scientists? <span class=\"inlineAnswer letter\" data-q=\"34\"></span><br>A They use different criteria to judge human and animal study findings.<br>B They alter the meanings of the terms of reference they use.<br>C They fail to understand the purpose of her investigations.<br>D They claim that there are flaws in her research methods.</li>\n<li>According to Herman, what is an important factor in the development of cognitive skills in both humans and dolphins? <span class=\"inlineAnswer letter\" data-q=\"35\"></span><br>A communicative ability<br>B brain capacity<br>C range of habitat<br>D social relationships</li>\n</ol>\n<h3>Questions 36-40</h3>\n<p><strong>YES / NO / NOT GIVEN</strong></p>\n<ol start=\"36\">\n<li>In 1977 only a few scientists believed that birds were capable of logical thought. <span class=\"inlineAnswer short\" data-q=\"36\"></span></li>\n<li>Pepperberg wanted to see if Alex could be trained to speak English fluently. <span class=\"inlineAnswer short\" data-q=\"37\"></span></li>\n<li>Higher apes such as chimpanzees show an awareness of others' intentions. <span class=\"inlineAnswer short\" data-q=\"38\"></span></li>\n<li>Betty was the only crow in Kacelnik's study who made a tool out of wire. <span class=\"inlineAnswer short\" data-q=\"39\"></span></li>\n<li>It is now widely accepted that animals understand about past events. <span class=\"inlineAnswer short\" data-q=\"40\"></span></li>\n</ol>"}]; const ANSWERS={"1": "science", "2": "technology", "3": "parents", "4": "Powerhouse", "5": "cooperation", "6": "interactive", "7": "favorite displays", "8": "break", "9": "two hours", "10": "TRUE", "11": "NOT GIVEN", "12": "FALSE", "13": "NOT GIVEN", "14": "F", "15": "A", "16": "B", "17": "D", "18": "D", "19": "A", "20": "D", "21": "C", "22": "D", "23": "A", "24": "facade", "25": "escalators", "26": "atrium", "27": "G", "28": "D", "29": "F", "30": "B", "31": "A", "32": "C", "33": "D", "34": "B", "35": "B", "36": "YES", "37": "NO", "38": "NOT GIVEN", "39": "YES", "40": "NO"};

function init(){studentName.value=state.studentName||"";studentClass.value=state.studentClass||"";tabs.innerHTML=PASSAGES.map((p,i)=>`<button class="tab ${i===0?'active':''}" onclick="showPassage(${i})">${p.title}<br><span class="small">${p.range}</span></button>`).join("");studentName.addEventListener("input",save);studentClass.addEventListener("input",save);showPassage(0);timer.textContent=formatTime(seconds);timeBox.textContent=formatTime(seconds)}

function checkAnswers(){save();let score=0,wrong=[],blank=[];for(let i=1;i<=40;i++){const inp=document.getElementById("q"+i);const span=inp?inp.closest(".inlineAnswer"):null;if(span)span.classList.remove("correct","wrong","blankState");const user=(state.answers&&state.answers[i])||"";const mini=document.getElementById("mini"+i);if(mini)mini.style.background="#fbfdff";if(!user.trim()){if(span)span.classList.add("blankState");blank.push(i);if(mini)mini.style.background="#fff7ed"}else if(isCorrect(i,user)){if(span)span.classList.add("correct");score++;if(mini)mini.style.background="#dcfce7"}else{if(span)span.classList.add("wrong");wrong.push(`${i}. Your answer: ${user} | Correct: ${correctText(i)}`);if(mini)mini.style.background="#fee2e2"}}scoreBox.textContent=score+"/40";const range=score<=18?"0-18":(score<=27?"19-27":"28-40");rangeBox.textContent=range;const msg=score<=18?"You are unlikely to get an acceptable score under examination conditions.":score<=27?"You may get an acceptable score, but more practice is recommended.":"You are likely to get an acceptable score under examination conditions.";resultBox.textContent=`Score: ${score}/40\nRange: ${range}\n${msg}\n\nBlank: ${blank.length?blank.join(", "):"None"}\n\nWrong answers:\n${wrong.length?wrong.join("\n"):"None"}`}

  if(!confirm("Clear all highlights in all passages?")) return;
  for(let i=0;i<PASSAGES.length;i++){
    localStorage.removeItem("tec_highlight_mock4_fixed_"+i);
  }
  passageBody.innerHTML=formatPassage(PASSAGES[currentIndex].text);
}
function clearAnswers(){if(!confirm("Clear all answers?"))return;state.answers={};localStorage.setItem("tec_reading_mock4_state",JSON.stringify(state));document.querySelectorAll(".answerInput").forEach(i=>i.value="");document.querySelectorAll(".inlineAnswer").forEach(s=>s.classList.remove("correct","wrong","blankState"));scoreBox.textContent="0/40";rangeBox.textContent="-";resultBox.textContent="Your result will appear here after submission.";renderAnswerPanel();updateStats()}
document.addEventListener("selectionchange",()=>{const sel=window.getSelection();const pop=document.getElementById("highlightPopup");if(!sel||sel.isCollapsed){pop.style.display="none";return}const range=sel.getRangeAt(0);const container=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;if(!container||!container.closest(".selectable")){pop.style.display="none";return}savedRange=range.cloneRange();const rect=range.getBoundingClientRect();pop.style.left=(window.scrollX+rect.left+rect.width/2-55)+"px";pop.style.top=(window.scrollY+rect.top-44)+"px";pop.style.display="block"})
function applyHighlight(){if(!savedRange)return;const mark=document.createElement("mark");mark.className="tecHighlight";try{savedRange.surroundContents(mark)}catch(e){mark.appendChild(savedRange.extractContents());savedRange.insertNode(mark)}window.getSelection().removeAllRanges();highlightPopup.style.display="none";localStorage.setItem("tec_highlight_mock4_fixed_"+currentIndex,passageBody.innerHTML)}
init();
